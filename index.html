<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Himanshu Suthar | Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="hero">

            <div class="badge">
                🐍 GITHUB SNAKE
            </div>

            <h1>
                HIMANSHU SUTHAR
            </h1>

            <p>
                MERN Stack Developer
            </p>

            <p class="subtitle">
                Watch the Snake play automatically.
            </p>

        </header>


        <section class="game-section">

            <div class="game-header">

                <span>
                    SNAKE.EXE
                </span>

                <span id="status">
                    ● AUTOPLAY
                </span>

            </div>


            <canvas
                id="gameCanvas"
                width="600"
                height="600"
            ></canvas>


            <div class="game-info">

                <div>
                    SCORE
                    <strong id="score">0</strong>
                </div>

                <div>
                    HIGH SCORE
                    <strong id="highScore">0</strong>
                </div>

                <div>
                    STATUS
                    <strong id="gameStatus">PLAYING</strong>
                </div>

            </div>

        </section>


        <footer>

            <p>
                Built with HTML • CSS • JavaScript
            </p>

            <a
                href="https://github.com/himanshusuthar04"
                target="_blank"
            >
                VIEW MY GITHUB →
            </a>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
